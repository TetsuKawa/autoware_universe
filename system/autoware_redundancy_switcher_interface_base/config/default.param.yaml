# Default configuration file for redundancy_switcher_interface
redundancy_switcher_interface:
  ros__parameters:
    switcher_plugin: "redundancy_switcher::SwitcherAdapter"
    subsystem_plugin: "redundancy_switcher::SubSystemAdapter"

    # Debug flag
    debug: false

    # Timeout configuration (in seconds)
    autoware_health_check_timeout: 5.0
    switcher_request_timeout: 10.0

    # Mode transition configuration
    default_mode: "standby"
    allow_mode_transitions:
      - from: "standby"
        to: "active"
      - from: "active"
        to: "standby"
      - from: "standby"
        to: "inactive"
