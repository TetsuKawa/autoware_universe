# Default configuration for autoware_redundancy_switcher_interface.
# Switcher-plugin-specific parameters (UDS paths, is_main_ecu, etc.) must be
# provided by the plugin package (e.g., autoware_redundancy_switcher_interface_plugin).
/**:
  ros__parameters:
    # Set false for a non-redundant (single-ECU) system.
    # When false, switcher_plugin is NOT loaded and the system is treated as permanently stable.
    is_redundant: true

    # pluginlib class name for the switcher-side adapter.
    # Must be set when is_redundant=true. Leave unset to require explicit configuration.
    # Example: "redundancy_switcher::SwitcherAdapter"
    switcher_plugin: ""

    diag:
      # DiagAdapter: transitional states (INITIALIZING / IN_ELECTION / etc.) that last longer
      # than this threshold are reported as DiagStatus::ERROR.
      # Equivalent to initializing_timeout in the original implementation (unit: ms).
      transitional_timeout_milli: 10000.0
